<!doctype html>
<!--
  The animated hero for the Metric Group UK invitation email (2026-10-05).
  Drawn in the style of the Metric Membership app's own night scene, and
  rendered frame by frame by tool/make-invite-art.js: frame(t) for t in [0, 1)
  is one loop. A car arrives, the camera reads the plate, the barrier lifts,
  the car drives through and the barrier comes down again.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; src: url('../../../MetricMembership/app/assets/fonts/PlusJakartaSans-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: Jakarta; src: url('../../../MetricMembership/app/assets/fonts/PlusJakartaSans-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: Jakarta; src: url('../../../MetricMembership/app/assets/fonts/PlusJakartaSans-SemiBold.ttf'); font-weight: 600; }
  html, body { margin: 0; padding: 0; background: #07103f; }
  svg { display: block; }
  text { font-family: Jakarta, sans-serif; }
</style>
</head>
<body>
<svg id="s" width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b33"/>
      <stop offset="1" stop-color="#0d1f78"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6be312"/>
      <stop offset="1" stop-color="#3fae05"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c9" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cff3a" stop-opacity=".0"/>
      <stop offset="1" stop-color="#7cff3a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2f5"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="560"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#sky)"/>
    <g id="stars"></g>
    <g id="city"></g>
    <!-- road -->
    <rect y="372" width="1200" height="130" fill="#0a1450"/>
    <rect y="372" width="1200" height="4" fill="#1b2c86"/>
    <g id="lane"></g>
    <rect y="502" width="1200" height="58" fill="#14266f"/>
    <rect y="502" width="1200" height="3" fill="#2a3d9a"/>

    <!-- camera on its post -->
    <g transform="translate(905 0)">
      <rect x="-5" y="196" width="10" height="250" rx="5" fill="url(#post)"/>
      <rect x="-62" y="180" width="80" height="34" rx="12" fill="#ffffff"/>
      <circle cx="-48" cy="197" r="9" fill="#0b1a6b"/>
      <circle id="led" cx="8" cy="188" r="5" fill="#ff4d5e"/>
      <path id="scanbeam" d="M -56 205 L -560 422 L -440 422 Z" fill="url(#scan)" opacity="0"/>
    </g>

    <!-- barrier -->
    <g transform="translate(800 0)">
      <rect x="-26" y="318" width="52" height="132" rx="12" fill="url(#post)"/>
      <rect x="-26" y="340" width="52" height="8" fill="#5ad400"/>
      <circle cx="0" cy="332" r="9" id="bled" fill="#ff4d5e"/>
      <g id="arm" transform="translate(0 362) rotate(0)">
        <rect x="-330" y="-9" width="340" height="18" rx="9" fill="#ffffff"/>
        <g fill="#0b1a6b">
          <rect x="-300" y="-9" width="30" height="18"/>
          <rect x="-230" y="-9" width="30" height="18"/>
          <rect x="-160" y="-9" width="30" height="18"/>
          <rect x="-90" y="-9" width="30" height="18"/>
        </g>
        <circle cx="0" cy="0" r="13" fill="#9fb0ec"/>
      </g>
    </g>

    <!-- the member's car -->
    <g id="car" transform="translate(-400 0)">
      <path id="headbeam" d="M 300 384 L 470 350 L 470 440 Z" fill="url(#beam)"/>
      <ellipse cx="150" cy="458" rx="160" ry="10" fill="#050a2c" opacity=".55"/>
      <path d="M 10 440 Q 2 400 30 392 L 80 384 Q 110 330 150 322 L 220 320 Q 252 322 276 360 L 290 384 Q 312 388 312 410 L 312 440 Q 312 450 300 450 L 22 450 Q 10 450 10 440 Z" fill="url(#body)"/>
      <path d="M 96 384 Q 120 340 150 334 L 182 333 L 182 384 Z" fill="#0b1a6b"/>
      <path d="M 194 333 L 222 333 Q 246 336 264 384 L 194 384 Z" fill="#0b1a6b"/>
      <rect x="292" y="392" width="20" height="12" rx="4" fill="#fff4c2"/>
      <rect x="8" y="396" width="10" height="14" rx="3" fill="#ff4d5e"/>
      <g>
        <rect x="212" y="396" width="78" height="21" rx="4" fill="#ffd400"/>
        <text x="251" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#111">MG25 UKV</text>
      </g>
      <g id="w1" transform="translate(76 450)">
        <circle r="30" fill="#0a0f2e"/><circle r="17" fill="#c7d0f2"/>
        <g stroke="#6e7bb5" stroke-width="4"><line x1="-15" y1="0" x2="15" y2="0"/><line x1="0" y1="-15" x2="0" y2="15"/><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="-11" y1="11" x2="11" y2="-11"/></g>
      </g>
      <g id="w2" transform="translate(246 450)">
        <circle r="30" fill="#0a0f2e"/><circle r="17" fill="#c7d0f2"/>
        <g stroke="#6e7bb5" stroke-width="4"><line x1="-15" y1="0" x2="15" y2="0"/><line x1="0" y1="-15" x2="0" y2="15"/><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="-11" y1="11" x2="11" y2="-11"/></g>
      </g>
    </g>

    <!-- "member" tag above the plate when the camera has read it -->
    <g id="tag" opacity="0">
      <rect x="-118" y="-30" width="236" height="52" rx="26" fill="#ffffff"/>
      <circle cx="-88" cy="-4" r="16" fill="#5ad400"/>
      <path d="M -96 -4 L -90 3 L -79 -10" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-62" y="3" font-size="20" font-weight="800" fill="#0b1a6b">Member · let in</text>
    </g>

    <!-- brand lockup -->
    <image href="../../../MetricMembership/server/public/brand/metric-logo-white.png" x="48" y="42" width="190" height="43"/>
    <rect x="256" y="46" width="150" height="36" rx="18" fill="none" stroke="#5ad400" stroke-width="2"/>
    <text x="331" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#5ad400" letter-spacing="2">MEMBERSHIP</text>
    <g transform="translate(1152 64)">
      <text x="-46" y="7" text-anchor="end" font-size="17" font-weight="600" fill="#c3cbf3">powered by</text>
      <image href="../../../MetricMembership/server/public/brand/vesopa-mark.png" x="-38" y="-19" width="38" height="38"/>
    </g>
    <text x="48" y="150" font-size="44" font-weight="800" fill="#ffffff">Metric Group UK</text>
    <text x="50" y="190" font-size="22" font-weight="600" fill="#aab6ef">is live on Vesopa EPOS</text>
  </g>
</svg>
<script>
  // Deterministic "random", so every render of a frame is the same picture.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const stars = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    el('circle', { cx: rnd() * 1200, cy: rnd() * 230, r: rnd() * 1.6 + 0.4, fill: '#fff', opacity: (0.3 + rnd() * 0.6).toFixed(2), 'data-tw': rnd().toFixed(3) }, stars);
  }
  const city = document.getElementById('city');
  let x = 430;
  while (x < 1200) {
    const w = 46 + rnd() * 52, h = 90 + rnd() * 150;
    el('rect', { x, y: 372 - h, width: w, height: h, fill: rnd() > 0.5 ? '#132a9a' : '#10238a' }, city);
    for (let wy = 372 - h + 12; wy < 360; wy += 18) {
      for (let wx = x + 8; wx < x + w - 10; wx += 15) {
        if (rnd() > 0.55) el('rect', { x: wx, y: wy, width: 6, height: 7, fill: '#7e95ff', opacity: (0.35 + rnd() * 0.5).toFixed(2) }, city);
      }
    }
    x += w + 6 + rnd() * 10;
  }
  // The parking sign on the tallest block's corner.
  el('rect', { x: 1110, y: 120, width: 34, height: 34, rx: 7, fill: '#5ad400' }, city);
  const p = el('text', { x: 1127, y: 146, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 800, fill: '#0b1a6b' }, city);
  p.textContent = 'P';

  const lane = document.getElementById('lane');

  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => (v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2);
  const span = (t, a, b) => clamp((t - a) / (b - a));

  window.frame = function frame(t) {
    // car x: arrive (0 → .32), wait at the barrier, drive through (.58 → .86)
    const arrive = ease(span(t, 0.0, 0.32));
    const leave = span(t, 0.58, 0.86);
    const carX = -400 + arrive * 540 + leave * leave * 1160;
    document.getElementById('car').setAttribute('transform', `translate(${carX} 0)`);
    const turned = carX * 1.1;
    document.getElementById('w1').setAttribute('transform', `translate(76 450) rotate(${turned})`);
    document.getElementById('w2').setAttribute('transform', `translate(246 450) rotate(${turned})`);

    // camera reads the plate (.30 → .44)
    const scanning = t > 0.3 && t < 0.44;
    document.getElementById('scanbeam').setAttribute('opacity', scanning ? (0.5 + 0.5 * Math.sin(t * 120)).toFixed(2) : 0);
    const ok = t >= 0.42 && t < 0.92;
    document.getElementById('led').setAttribute('fill', ok ? '#5ad400' : '#ff4d5e');
    document.getElementById('bled').setAttribute('fill', ok ? '#5ad400' : '#ff4d5e');

    // tag pops above the car (.42 → .62)
    const tagIn = ease(span(t, 0.42, 0.47));
    const tagOut = span(t, 0.6, 0.66);
    const tag = document.getElementById('tag');
    tag.setAttribute('opacity', (tagIn * (1 - tagOut)).toFixed(2));
    tag.setAttribute('transform', `translate(${carX + 170} ${292 - tagIn * 14}) scale(${0.85 + 0.15 * tagIn})`);

    // barrier up (.46 → .58), down again (.86 → .97)
    const up = ease(span(t, 0.46, 0.58)) * (1 - ease(span(t, 0.86, 0.97)));
    document.getElementById('arm').setAttribute('transform', `translate(0 362) rotate(${up * 82})`);

    // lane markings slide very slightly so the road feels alive
    lane.innerHTML = '';
    for (let i = -1; i < 14; i++) {
      el('rect', { x: i * 96 + ((t * 96) % 96), y: 436, width: 44, height: 4, rx: 2, fill: '#2b3f9e' }, lane);
    }
    // twinkle
    for (const s of stars.children) {
      const tw = Number(s.dataset.tw);
      s.setAttribute('opacity', (0.35 + 0.45 * (0.5 + 0.5 * Math.sin((t + tw) * Math.PI * 2))).toFixed(2));
    }
  };
  frame(0);
  window.ready = true;
</script>
</body>
</html>
