<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url(PlusJakartaSans-Medium.ttf);font-weight:500}
@font-face{font-family:J;src:url(PlusJakartaSans-Bold.ttf);font-weight:700}
@font-face{font-family:J;src:url(PlusJakartaSans-ExtraBold.ttf);font-weight:800}
*{box-sizing:border-box;margin:0}
html,body{width:600px;height:300px;overflow:hidden}
body{font-family:J}
.h{position:relative;width:600px;height:300px;background:radial-gradient(circle at 82% 30%,#2a3fb8 0,#13248a 38%,#0b1a6b 70%,#070f45 100%);color:#fff;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%)}
.lock{position:absolute;left:32px;top:28px;display:flex;align-items:center;gap:12px}
.lock .x{font-size:20px;font-weight:700;color:#a5c715;line-height:1}
.tag{position:absolute;left:32px;top:96px;font-size:11px;font-weight:800;letter-spacing:2px;color:#a5c715}
.t{position:absolute;left:32px;top:116px;font-size:31px;line-height:1.12;font-weight:800;white-space:nowrap}
.t span{color:#a5c715}
.s{position:absolute;left:32px;top:162px;font-size:14px;line-height:1.5;color:#c9d0f5;width:290px;font-weight:500}
.chip{position:absolute;left:32px;top:240px;display:flex;gap:8px}
.chip div{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff}
.chip div.g{background:#a5c715;color:#0b1a6b}
/* the till */
.till{position:absolute;left:344px;top:46px;width:170px;height:118px;border-radius:12px;background:#1b1830;border:5px solid #26223f;box-shadow:0 18px 40px rgba(0,0,0,.5);transform:rotate(-4deg)}
.ts{position:absolute;inset:4px;border-radius:7px;background:#fff;overflow:hidden;color:#17141c;padding:8px}
.ts .hd{font-size:7px;font-weight:800;letter-spacing:1px;color:#5f5a68}
.ts .am{font-size:18px;font-weight:800;color:#0b1a6b;margin:3px 0 6px}
.ts .st{display:flex;gap:4px;align-items:center;font-size:7px;font-weight:800;color:#2f8f00}
.ts .st i{width:7px;height:7px;border-radius:4px;background:#2f8f00;display:block}
.ts .bar{margin-top:7px;height:16px;border-radius:5px;background:#0b1a6b;color:#fff;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stand{position:absolute;left:412px;top:162px;width:34px;height:30px;background:#26223f;transform:rotate(-4deg);border-radius:0 0 6px 6px}
/* the Teya card machine */
.pdq{position:absolute;left:478px;top:96px;width:86px;height:160px;border-radius:16px;background:#111;box-shadow:0 18px 36px rgba(0,0,0,.5);transform:rotate(7deg);padding:7px}
.pdq .sc{height:96px;border-radius:9px;background:#fff;color:#111;padding:8px 6px;text-align:center}
.pdq .mk{display:block;width:50px;height:auto;margin:4px auto 8px}
.pdq .w{font-size:9px;font-weight:800}
.pdq .n{font-size:6px;font-weight:700;color:#5f5a68;margin-top:3px}
.pdq .k{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.pdq .k div{height:9px;border-radius:3px;background:#2b2b2b}
.wave{position:absolute;left:452px;top:120px;font-size:22px;color:#d8f000;transform:rotate(90deg);font-weight:800;opacity:.9}
</style></head><body><div class="h"><div class="grid"></div>
<div class="lock"><img src="logo-dark.svg" style="height:22px"><span class="x">&times;</span><img src="teya-white.svg" style="height:27px"></div>
<div class="tag">TEYA SANDBOX &middot; POSLINK</div>
<div class="t">Vesopa <span>+</span> Teya</div>
<div class="s">Vesopa EPOS is built on Teya's SDK. One thing left to test it: a store on our sandbox account.</div>
<div class="chip"><div class="g">Sandbox</div><div>Test company and store</div></div>
<div class="till"><div class="ts">
<div class="hd">VESOPA EPOS &middot; CARD</div>
<div class="am">£12.50</div>
<div class="st"><i></i>Present card</div>
<div class="bar">Cancel</div>
</div></div>
<div class="stand"></div>
<div class="pdq"><div class="sc"><img class="mk" src="teya-logo.svg"><div class="w">£12.50</div><div class="n">Tap, insert or swipe</div></div>
<div class="k"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
</div></body></html>
