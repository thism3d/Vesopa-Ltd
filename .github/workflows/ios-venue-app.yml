# A venue's own iPhone app (with its Apple Watch app), built on a Mac runner.
#
# Nobody at Vesopa builds on a Mac, so a venue app made by
# vesopa_loyalty/tool/make_venue_app.py (PontardaweRFC/ and the like) is
# built here. Run it from the Actions tab: "iOS - venue app", Run workflow,
# with the venue's folder.
#
# WITHOUT the App Store Connect key it still builds the app (unsigned), which
# proves the project compiles and leaves nothing to fix but signing. WITH the
# key it archives, lets Apple sign it (cloud-managed certificates, no .p12 in
# this repository; Xcode registers the app's App IDs itself) and uploads it,
# where it appears under TestFlight. The app must already have a record in
# App Store Connect (Apps > + New App, its bundle id from venue.json).
#
# The key is the same three repository secrets ios-kitchen.yml uses
# (Settings > Secrets and variables > Actions), from App Store Connect > Users
# and Access > Integrations > App Store Connect API > Team Keys, Admin role:
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole downloaded AuthKey_XXXXXXXXXX.p8, pasted in
#
# The version and build number are venue.json's: raise "build" for each upload.

name: iOS - venue app

on:
  workflow_dispatch:
    inputs:
      venue:
        description: The venue's folder
        required: true
        default: PontardaweRFC

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      VENUE: ${{ inputs.venue }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Make the venue's project
        run: |
          case "$VENUE" in *[!A-Za-z0-9_-]*|'') echo "::error::Not a venue folder: $VENUE"; exit 1;; esac
          test -f "$VENUE/venue.json" || { echo "::error::$VENUE/venue.json not found"; exit 1; }
          python3 vesopa_loyalty/tool/make_venue_app.py "$VENUE"

      - name: Flutter build
        working-directory: ${{ inputs.venue }}/build/app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define-from-file=venue_defines.json

      - name: App Store Connect key
        id: key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Built, not uploaded: set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 to sign and upload (see the top of this file)."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Archive (iPhone app with the Watch app)
        if: steps.key.outputs.upload == 'true'
        working-directory: ${{ inputs.venue }}/build/app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Venue.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Sign and upload to App Store Connect
        if: steps.key.outputs.upload == 'true'
        working-directory: ${{ inputs.venue }}/build/app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Venue.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
