# A venue's own iPhone app (with its Apple Watch app), built on a Mac runner,
# uploaded to TestFlight, with its App Store listing filled in.
#
# Nobody at Vesopa builds on a Mac, so a venue app made by
# vesopa_loyalty/tool/make_venue_app.py (PontardaweRFC/ and the like) is
# built here. Run it from the Actions tab: "iOS - venue app", Run workflow,
# with the venue's folder.
#
# WITHOUT the App Store Connect key it still builds the app (unsigned), which
# proves the project compiles and leaves nothing to fix but signing. WITH the
# key, vesopa_loyalty/tool/app_store_connect.py and xcodebuild do the rest:
#
#   1. register the App IDs (the app and its Watch app), Push Notifications on,
#      and pick the next free build number for venue.json's version
#   2. archive, let Apple sign it (cloud-managed certificates, no .p12 in this
#      repository) and upload it
#   3. fill the App Store listing from <venue>/store/app_store.json and upload
#      <venue>/store/screenshots/ (tool/make_store_screenshots.py draws them)
#   4. wait for Apple to process the build, then give it to the internal
#      TestFlight group and attach it to the App Store version
#
# Nothing is submitted for App Review. The run's summary lists anything Apple's
# API cannot do (the app record the first time, App Privacy).
#
# The key is in the "App Store Connect API" environment (Settings >
# Environments), from App Store Connect > Users and Access > Integrations >
# App Store Connect API > Team Keys, Admin role:
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole downloaded AuthKey_XXXXXXXXXX.p8, pasted in
# and, optionally, for App Review (the app is members-only):
#   ASC_REVIEW_USER, ASC_REVIEW_PASSWORD   a member account with a password
#   ASC_REVIEW_PHONE                       a contact number for the reviewer

name: iOS - venue app

on:
  workflow_dispatch:
    inputs:
      venue:
        description: The venue's folder
        required: true
        default: PontardaweRFC
      mode:
        description: check = only report what App Store Connect has; full = build, upload, listing and TestFlight; listing = only the listing and screenshots
        type: choice
        options: [full, check, listing]
        default: full

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    environment: App Store Connect API
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      VENUE: ${{ inputs.venue }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Venue folder
        run: |
          case "$VENUE" in *[!A-Za-z0-9_-]*|'') echo "::error::Not a venue folder: $VENUE"; exit 1;; esac
          test -f "$VENUE/venue.json" || { echo "::error::$VENUE/venue.json not found"; exit 1; }

      - name: App Store Connect key
        id: key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Built, not uploaded: set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 in the App Store Connect API environment (see the top of this file)."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet "pyjwt[crypto]"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: App IDs, app record and build number
        id: asc
        if: steps.key.outputs.upload == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py status "$VENUE"
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py prepare "$VENUE"

      - name: Make the venue's project
        if: inputs.mode == 'full'
        run: python3 vesopa_loyalty/tool/make_venue_app.py "$VENUE"

      - name: Flutter build
        if: inputs.mode == 'full'
        working-directory: ${{ inputs.venue }}/build/app
        env:
          BUILD_NUMBER: ${{ steps.asc.outputs.build }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define-from-file=venue_defines.json \
            ${BUILD_NUMBER:+--build-number=$BUILD_NUMBER}

      # Xcode's automatic signing wants a development profile to archive, and
      # Apple will not make one for a team with no registered iPhone. So:
      # a distribution certificate and App Store profiles made for this run
      # (app_store_connect.py signing), in a keychain of the run's own.
      - name: Distribution signing
        if: steps.key.outputs.upload == 'true' && inputs.mode == 'full'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          S="$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py signing "$VENUE" "$S"
          pass="$(uuidgen)"
          # The system LibreSSL writes the older PKCS#12 that the keychain reads.
          /usr/bin/openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/dist.key.pem" -in "$S/dist.pem" -out "$S/dist.p12" -passout "pass:$pass"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$pass" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$pass" "$KC"
          curl -fsSL -o "$S/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$S/AppleWWDRCAG3.cer" -k "$KC" -A || true
          security import "$S/dist.p12" -k "$KC" -P "$pass" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$S"/*.mobileprovision "$d/"
          done
          rm -f "$S/dist.key.pem" "$S/dist.p12"
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py sign-project "$VENUE" "$S/profiles.json"

      - name: Archive (iPhone app with the Watch app)
        if: steps.key.outputs.upload == 'true' && inputs.mode == 'full'
        working-directory: ${{ inputs.venue }}/build/app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Venue.xcarchive"

      - name: Sign and upload to App Store Connect
        if: steps.key.outputs.upload == 'true' && inputs.mode == 'full'
        working-directory: ${{ inputs.venue }}/build/app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Venue.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: App Store listing and screenshots
        if: steps.key.outputs.upload == 'true' && inputs.mode != 'check'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_REVIEW_USER: ${{ secrets.ASC_REVIEW_USER }}
          ASC_REVIEW_PASSWORD: ${{ secrets.ASC_REVIEW_PASSWORD }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
        run: |
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py store "$VENUE"

      - name: TestFlight
        if: steps.key.outputs.upload == 'true' && inputs.mode == 'full'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_REVIEW_USER: ${{ secrets.ASC_REVIEW_USER }}
          ASC_REVIEW_PASSWORD: ${{ secrets.ASC_REVIEW_PASSWORD }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
        run: |
          "$RUNNER_TEMP/asc/bin/python" vesopa_loyalty/tool/app_store_connect.py testflight "$VENUE" "${{ steps.asc.outputs.build }}"

      - name: Remove the key and the signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
