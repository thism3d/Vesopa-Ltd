# The Vesopa EPOS Lite demo for iPhone, on TestFlight with a public link: the
# iPhone twin of android-lite-demo.yml. Built on a Mac runner, signed and
# uploaded the way ios-venue-app.yml does it (vesopa_epos_lite/tool/testflight.py
# imports that workflow's app_store_connect.py), with the same key in the
# "App Store Connect API" environment.
#
# Actions > "iOS - Lite demo" > Run workflow. The first run stops at "prepare"
# with what to type in App Store Connect (Apple's API cannot make the app record
# for com.vesopa.eposlite); after that, every run builds, uploads, adds the
# build to the "Public demo" TestFlight group and sends it to Beta App Review.
# The run's summary prints the public link. It opens for anyone once Apple has
# approved the build (usually within a day).
#
# The demo is the real app built with LITE_DEMO_ONLY (PIN 1111, pretend card
# payments). It signs without the Tap to Pay and NFC entitlements: the demo
# reads no cards, and Apple grants Tap to Pay per app on request.
#
# Not on every push: each upload is a new build for Apple to review.

name: iOS - Lite demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    environment: App Store Connect API
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: App Store Connect key
        id: key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Built, not uploaded: set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 in the App Store Connect API environment."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet "pyjwt[crypto]"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: App ID, app record and build number
        id: asc
        if: steps.key.outputs.upload == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          "$RUNNER_TEMP/asc/bin/python" vesopa_epos_lite/tool/testflight.py prepare

      - name: The demo's entitlements and export compliance
        working-directory: vesopa_epos_lite/ios/Runner
        run: |
          cat > Runner.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist

      - name: Flutter build
        working-directory: vesopa_epos_lite
        env:
          BUILD_NUMBER: ${{ steps.asc.outputs.build }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=LITE_DEMO_ONLY=true \
            ${BUILD_NUMBER:+--build-number=$BUILD_NUMBER}

      # As ios-venue-app.yml: a distribution certificate and App Store profile
      # made for this run, in a keychain of the run's own.
      - name: Distribution signing
        if: steps.key.outputs.upload == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          S="$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/asc/bin/python" vesopa_epos_lite/tool/testflight.py signing "$S"
          pass="$(uuidgen)"
          /usr/bin/openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/dist.key.pem" -in "$S/dist.pem" -out "$S/dist.p12" -passout "pass:$pass"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$pass" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$pass" "$KC"
          curl -fsSL -o "$S/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$S/AppleWWDRCAG3.cer" -k "$KC" -A || true
          security import "$S/dist.p12" -k "$KC" -P "$pass" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$S"/*.mobileprovision "$d/"
          done
          rm -f "$S/dist.key.pem" "$S/dist.p12"
          "$RUNNER_TEMP/asc/bin/python" vesopa_epos_lite/tool/testflight.py sign-project "$S/profiles.json"

      - name: Archive
        if: steps.key.outputs.upload == 'true'
        working-directory: vesopa_epos_lite
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lite.xcarchive"

      - name: Sign and upload to App Store Connect
        if: steps.key.outputs.upload == 'true'
        working-directory: vesopa_epos_lite
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lite.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: TestFlight and the public link
        if: steps.key.outputs.upload == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          "$RUNNER_TEMP/asc/bin/python" vesopa_epos_lite/tool/testflight.py testflight "${{ steps.asc.outputs.build }}"
