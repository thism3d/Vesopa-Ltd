# One link for everyone who should try Vesopa Go, on GitHub Pages, with no app
# store and no sign-in:
#
#   https://thism3d.github.io/Vesopa-Ltd/
#
# The page (vesopa_go/tool/share_index.html) opens the web app in app/, from
# vesopa_go/tool/web_demo.py, which an iPhone can add to its home screen as an
# app. The demo is the real app with GO_DEMO_ONLY (PIN 1111, pretend card
# payments).
#
# Runs on every push to main that changes Go, and by hand from Actions >
# "Web - Go demo" > Run workflow. Needs GitHub Pages switched on once, with its
# source set to GitHub Actions (Settings > Pages); the run's first step tries to
# do that itself.

name: Web - Go demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vesopa_go/lib/**'
      - 'vesopa_go/assets/**'
      - 'vesopa_go/store/icon-1024.png'
      - 'vesopa_go/pubspec.*'
      - 'vesopa_go/tool/web_demo.py'
      - 'vesopa_go/tool/share_index.html'
      - '.github/workflows/web-go-demo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Build the page and the web demo
        run: |
          pip install --quiet pillow
          python3 vesopa_go/tool/web_demo.py "$RUNNER_TEMP/site/app"
          cp vesopa_go/tool/share_index.html "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
