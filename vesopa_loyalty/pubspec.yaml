name: vesopa_loyalty
description: "Vesopa Loyalty: a venue's own loyalty card, points and news."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.5+7

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  crypto: ^3.0.7
  web: ^1.1.1
  # A member's own photograph, from the camera or the gallery.
  image_picker: ^1.1.2
  # The card page turns the screen right up while the QR code is showing, as
  # airline and coffee-shop apps do; no browser can, so the web app does not.
  screen_brightness: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Vesopa's own mark, for the Continue with Vesopa button. Bundled rather
    # than fetched: the sign-in page is the first thing a member sees, often
    # on a bad line, and a provider button whose logo has not arrived yet
    # reads as a broken page.
    - assets/vesopa-mark.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------------------------------------------------------------------------
# The Microsoft Store package
#
# THE IDENTITY IS ASSIGNED BY PARTNER CENTER and must match it character for
# character. A package whose Identity/Name or Publisher differs by one letter
# is refused at upload with an error that names neither of them.
#
#   Package/Identity/Name                MeirionDavies.VesopaLoyalty
#   Package/Identity/Publisher           CN=3AD172E6-2CBA-4B09-AD50-B52C88D57FB3
#   Package/Properties/PublisherDisplayName  Vesopa EPOS Ltd
#   Package Family Name  MeirionDavies.VesopaLoyalty_nyzwpk2n60a5j
#   Store ID             9N6VWPJ25VPH
#
# THIS IS THE PLATFORM'S OWN APP, not a venue's. The same build is every
# venue's app -- name, logo and colours arrive at run time from the back
# office -- so this package is branded Vesopa. A venue wanting its own Store
# entry needs its own name reservation and identity, which is the owner's to
# obtain.
# ---------------------------------------------------------------------------
msix_config:
  # One of the app's reserved names. "The Vesopa Kitchen" was reserved beside
  # "Vesopa Loyalty" on 2026-09-14 so the demonstration installs as a venue's
  # own app would. The publisher display name is not ours to choose: it has to
  # match the Partner Center account exactly, or the package is refused.
  display_name: The Vesopa Kitchen
  publisher_display_name: Vesopa EPOS Ltd
  identity_name: MeirionDavies.VesopaLoyalty
  publisher: CN=3AD172E6-2CBA-4B09-AD50-B52C88D57FB3

  # Four parts, and the Store requires the last to be 0. A version can never
  # be reused, so bump this -- and `version:` above -- for every submission,
  # including a resubmission after a failed certification.
  msix_version: 1.0.5.0

  # The demonstration venue's own logo (tool/make_store_art.py writes it).
  logo_path: assets/brand/kitchen_demo_mark_512.png

  # internetClient is all it needs: the app talks to the back office over
  # HTTPS and to nothing on the venue's own network. Asking for more than is
  # used is a question at certification and a line on the Store page telling
  # customers this app wants something it does not.
  capabilities: internetClient

  store: true
  install_certificate: false
  architecture: x64

  # English only. The Store asks for a listing in every language the package
  # declares, so declaring one nobody has written costs a blocked submission.
  languages: en-gb

  output_path: build/store
  output_name: vesopa-loyalty-store
  # LOYALTY_SLUG=thevesopakitchen: THIS LISTING IS THE DEMONSTRATION APP, decided
  # 2026-09-14. Venues are not served by one shared listing -- each gets its
  # own white-label build under its own name -- so the Vesopa Loyalty entry
  # exists to show EPOS buyers what their own app would be, and it opens
  # straight on The Vesopa Kitchen with no venue code to type. A venue's own
  # build passes its own slug here the same way.
  windows_build_args: --release --dart-define=VESOPA_LOYALTY_CLIENT_ID=12a1047bafa611f185af42010a80000e --dart-define=LOYALTY_SLUG=thevesopakitchen
