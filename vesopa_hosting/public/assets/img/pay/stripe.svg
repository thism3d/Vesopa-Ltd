  <path d="M11 21.5h18" stroke="#fff" stroke-width="2"/>
  <path d="M15 26.5h3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
