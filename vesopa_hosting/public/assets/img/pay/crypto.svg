<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Cryptocurrency">
  <title>Cryptocurrency</title>
  <!-- Three overlapping coins: the category, not any one brand's mark. -->
  <circle cx="30" cy="24" r="11" fill="#26a17b"/>
  <text x="30" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#fff">₮</text>

  <circle cx="21" cy="24" r="11" fill="#627eea" stroke="#fff" stroke-width="2"/>
  <path d="M21 17.5l4 6.6-4 2.4-4-2.4z" fill="#fff" opacity=".92"/>
  <path d="M21 27.6l4-2.4-4 5.3-4-5.3z" fill="#fff" opacity=".72"/>

  <circle cx="12" cy="24" r="11" fill="#f7931a" stroke="#fff" stroke-width="2"/>
  <text x="12" y="29.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#fff">₿</text>

  <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-.4" fill="#111111">Cryptocurrency</text>
  <text x="46.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing=".2" fill="#787a6e">Bitcoin · Ethereum · USDT</text>
</svg>
