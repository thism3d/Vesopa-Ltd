<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="SSLCommerz">
  <title>SSLCommerz</title>
  <!--
    Drawn here rather than fetched. The app's CSP allows img-src 'self' only, so
    a remote logo renders as a broken image on the one screen where the customer
    is deciding whether to trust us with a card.
  -->
  <defs>
    <linearGradient id="sslcz-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9b5a"/>
      <stop offset="1" stop-color="#0b7c47"/>
    </linearGradient>
  </defs>

  <!-- Padlock badge: the secure-checkout cue, before any wordmark is read. -->
  <rect x="4" y="8" width="32" height="32" rx="9" fill="url(#sslcz-g)"/>
  <path d="M14.5 22.5v-3a5.5 5.5 0 0 1 11 0v3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="12.5" y="22" width="15" height="11.5" rx="3" fill="#fff"/>
  <circle cx="20" cy="27" r="1.9" fill="#0b7c47"/>
  <rect x="19.1" y="27.4" width="1.8" height="4" rx=".9" fill="#0b7c47"/>

  <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-.4" fill="#111111">SSLCommerz</text>
  <text x="45.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing=".2" fill="#787a6e">Cards · Wallets · Net banking</text>
</svg>
