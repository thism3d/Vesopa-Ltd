<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vesopa Go: choose the sound</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css?v=6">
<style>
  /* Three calm sounds to choose from by ear (2026-11-06). */
  .pick { max-width: 560px; margin: 0 auto; padding: 70px 20px 90px; text-align: center; }
  .pick h1 { font-size: clamp(34px, 6vw, 52px); letter-spacing: -.04em; line-height: 1.04; margin: 0 0 10px; font-weight: 900; }
  .pick > p { color: var(--muted); margin: 0 0 34px; }
  .choice { display: flex; align-items: center; gap: 18px; width: 100%; margin: 0 0 14px; padding: 20px 22px; text-align: left; cursor: pointer; font: inherit; color: var(--text);
    border-radius: 20px; background: linear-gradient(160deg, var(--raised), var(--card)); border: 1px solid var(--line); transition: border-color .3s var(--ease); }
  .choice.on { border-color: var(--lime); }
  .choice i { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--on-lime); font-style: normal; font-size: 20px; font-weight: 900; }
  .choice b { display: block; font-size: 20px; }
  .choice span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main class="pick">
  <h1>Choose the <em>sound.</em></h1>
  <p>Tap one to play it, tap again to stop. Tell me the number you like.</p>
  <button class="choice" type="button" data-src="/media/calm-piano.mp3"><i>▶</i><div><b>1 · Soft piano</b><span>Slow, gentle notes</span></div></button>
  <button class="choice" type="button" data-src="/media/calm-ocean.mp3"><i>▶</i><div><b>2 · Ocean waves</b><span>Just the sea, no music</span></div></button>
  <button class="choice" type="button" data-src="/media/calm-keys.mp3"><i>▶</i><div><b>3 · Warm keys</b><span>Mellow electric-piano chords</span></div></button>
</main>
<script>
(function () {
  var audio = new Audio(), current = null;
  audio.loop = true;
  document.querySelectorAll('.choice').forEach(function (b) {
    b.addEventListener('click', function () {
      if (current) { current.classList.remove('on'); current.querySelector('i').textContent = '▶'; }
      if (current === b) { audio.pause(); current = null; return; }
      current = b;
      audio.src = b.getAttribute('data-src');
      audio.play().catch(function () {});
      b.classList.add('on');
      b.querySelector('i').textContent = '■';
    });
  });
})();
</script>
</body>
</html>
