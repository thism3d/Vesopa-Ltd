# 3G as vesopa_loyalty: 8G crashed the daemon on the 14 GB build PC (2026-10-25).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Dojo's Pocket SDK needs compileSdk 37, past what AGP 9.1 lists (2026-10-31).
android.suppressUnsupportedCompileSdk=37
# Google's pay plugin compiles Kotlin for Java 8 and Java for 11, which is harmless
# but has stopped every Android build since Go 1.2.48 (2026-11-06).
kotlin.jvm.target.validation.mode=warning
