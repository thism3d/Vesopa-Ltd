<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="30-day satisfaction guarantee">
  <style>
    .seal{transform-origin:120px 108px;animation:turn 24s linear infinite}
    .shine{fill:#fff;opacity:0;animation:shine 4s ease-in-out infinite}
    .num{font:900 54px Orbitron,'Arial Black',Arial,sans-serif;fill:#0c1004}
    .lbl{font:800 15px Orbitron,'Arial Black',Arial,sans-serif;fill:#0c1004;letter-spacing:2px}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes shine{0%,60%{opacity:0}70%{opacity:.25}80%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.seal,.shine{animation:none}}
  </style>
  <path d="M88 160 L72 222 L98 208 L112 232 L120 178 Z M152 160 L168 222 L142 208 L128 232 L120 178 Z" fill="#7e9a0e"/>
  <g class="seal">
    <path fill="#a5c715" d="M120 20 l13 14 19-4 6 18 18 6-4 19 14 13-14 13 4 19-18 6-6 18-19-4-13 14-13-14-19 4-6-18-18-6 4-19-14-13 14-13-4-19 18-6 6-18 19 4z"/>
  </g>
  <circle cx="120" cy="108" r="58" fill="#a5c715" stroke="#0c1004" stroke-width="4"/>
  <circle cx="120" cy="108" r="48" fill="none" stroke="#0c1004" stroke-width="2" stroke-dasharray="3 5"/>
  <text class="num" x="120" y="118" text-anchor="middle">30</text>
  <text class="lbl" x="120" y="140" text-anchor="middle">DAYS</text>
  <circle class="shine" cx="120" cy="108" r="58"/>
</svg>
