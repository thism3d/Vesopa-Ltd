name: vesopa_epos_lite
description: "Vesopa EPOS Lite: a fast counter-service till on a phone, tablet or handheld card terminal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # The handheld half of the Vesopa family: sign-in, staff, the venue's menu
  # from the back office, the outbox, Dojo payments and refunds. Lite is a
  # different till on the same engine, not a copy of it.
  vesopa_tap:
    path: ../vesopa_tap

  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only so the tests can start from a new device with nothing stored.
  flutter_secure_storage: ^11.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/vesopa_v.png
