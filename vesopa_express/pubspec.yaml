name: vesopa_express
# Plain ASCII, deliberately: the msix tool copies this into AppxManifest.xml
# and mangles anything else (an em-dash in the kitchen's came out as a
# replacement glyph on its Store tile).
description: "Vesopa Express: the self-service ordering kiosk for Vesopa EPOS."
# Private, like the till and the kitchen. Never published to pub.dev.
publish_to: 'none'

# Its own line, starting at 1.0.0: unlike the kitchen and the display, a kiosk
# does not ship in lock-step with the till -- it talks only to the server.
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State. The same choice as the till and the kitchen, so moving between the
  # three apps is reading the same idioms.
  flutter_riverpod: ^3.3.2

  # Everything the kiosk knows comes from the back office over HTTPS. There is
  # no socket: a kiosk polls its one order while it is being paid for and its
  # config once a minute, and nothing else changes under it.
  http: ^1.6.0

  # The kiosk's own memory: its token, the order being paid for if the power
  # goes, and the last config (so the exit passcode works with no network).
  shared_preferences: ^2.5.5

  # Setting a kiosk up with Continue with Vesopa: the system browser, never a
  # web view inside the app -- see data/vesopa_sso.dart.
  url_launcher: ^6.3.0
  # SHA-256 for the PKCE challenge, and HMAC-SHA256 for checking the exit
  # passcode offline (PBKDF2, the same hash the server stores).
  crypto: ^3.0.3
  # A basket's id, so a kiosk that loses its connection while sending an
  # order sends it again as the same order.
  uuid: ^4.5.3

  # A kiosk runs one app, full screen, and cannot be closed or minimised from
  # the screen -- none of which is possible with Flutter's default window.
  window_manager: ^0.5.2

  # The ticket from the kiosk's own printer: ESC/POS, sent straight to a USB
  # printer, to a Windows print queue as a RAW job, or over the network to
  # port 9100 -- the till's printing path, brought across (see
  # lib/printing/). The same packages at the same versions as the till, so a
  # printer that works on one works on the other.
  esc_pos_utils_plus: ^2.0.4
  win32: ^6.4.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    # The Vesopa brand face, bundled rather than left to whatever Windows
    # substitutes: a kiosk is read at arm's length by strangers, and a menu set
    # in the fallback font looks like a menu nobody finished.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
    # For the one number that matters: the collection number, read off the
    # kiosk and then off a board across the room.
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-ExtraBold.ttf
          weight: 800

# Microsoft Store packaging.
#
# The identity Partner Center reserved for Vesopa Express on 11 September 2026
# (Store ID 9N5W5VLP2948, package family MeirionDavies.VesopaExpress_nyzwpk2n60a5j),
# copied exactly: a package whose Name or Publisher differs by one character
# is refused at upload, and the Store signs the package, so no certificate is
# used or needed here.
msix_config:
  display_name: Vesopa Express
  publisher_display_name: Vesopa EPOS Ltd
  identity_name: MeirionDavies.VesopaExpress
  publisher: CN=3AD172E6-2CBA-4B09-AD50-B52C88D57FB3

  # Four parts, and the Store requires the last to be 0. A version can never be
  # reused, so bump this -- and `version:` above -- for every submission,
  # including a resubmission after a failed certification.
  msix_version: 1.0.1.0

  logo_path: assets/brand/express_mark_512.png

  # internetClient              the back office over HTTPS
  # privateNetworkClientServer  a receipt printer on the venue's own network
  #                             (port 9100), and a back office on a local server
  capabilities: internetClient, privateNetworkClientServer

  store: true
  install_certificate: false
  architecture: x64

  # English only. The Store asks for a listing in every language the package
  # declares, and the Welsh is hidden until a Welsh speaker has checked it --
  # declaring cy-gb would have demanded a Welsh Store page to go with it.
  languages: en-gb

  output_path: build/store
  output_name: vesopa-express-store
  windows_build_args: --release
