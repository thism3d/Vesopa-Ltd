<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Membership · Console</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
  <div id="signin" class="signin" hidden>
    <main class="card narrow">
      <img src="/brand/metric-logo.png" alt="metric" class="logo">
      <h1>Membership console</h1>
      <p class="muted">For Metric Group staff.</p>
      <div id="signin-msg"></div>
      <p><a class="btn primary" id="signin-btn" href="/admin/signin">Continue with Vesopa</a></p>
    </main>
  </div>

  <div id="app" hidden>
    <header class="top">
      <img src="/brand/metric-logo.png" alt="metric" class="logo">
      <span class="title">Membership console</span>
      <span class="spacer"></span>
      <span class="muted small" id="who"></span>
      <button type="button" id="signout">Sign out</button>
    </header>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="overview" class="on">Overview</button>
      <button type="button" data-tab="members">Members</button>
      <button type="button" data-tab="sites">Sites and gates</button>
      <button type="button" data-tab="events">Barrier log</button>
      <button type="button" data-tab="activity">Activity log</button>
      <button type="button" data-tab="plans">Plans</button>
    </nav>
    <main id="view"></main>
    <footer class="powered">Metric Membership · powered by Vesopa</footer>
  </div>
</body>
</html>
