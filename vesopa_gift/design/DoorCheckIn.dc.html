<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0d1014; color: #e8edf1; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #e8edf1; }
    a:hover { color: #ffffff; }
    h1, h2, p { margin: 0; }
  </style>
</helmet>
<!-- Dark on purpose: a door at night, a bright screen in somebody's hand. -->
<div style="width: 390px; height: 844px; background: #0d1014; display: flex; flex-direction: column;">

  <div style="padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px;">
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 13px; color: #94a2ae;">Door · The Vesopa Kitchen</span>
      <span style="font-size: 18px; font-weight: 650;">Welsh wine tasting</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end;">
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">38<span style="color: #94a2ae; font-weight: 500; font-size: 16px;"> / 50</span></span>
      <span style="font-size: 12px; color: #94a2ae;">in so far</span>
    </div>
  </div>

  <!-- The camera -->
  <div style="margin: 0 20px; height: 360px; border-radius: 20px; background: linear-gradient(160deg, #2a2f36 0%, #161a1f 100%); position: relative; overflow: hidden;">
    <div style="position: absolute; left: 70px; top: 55px; width: 210px; height: 210px;">
      <div style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-left: 4px solid #a5c715; border-top: 4px solid #a5c715; border-top-left-radius: 14px;"></div>
      <div style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-right: 4px solid #a5c715; border-top: 4px solid #a5c715; border-top-right-radius: 14px;"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; border-left: 4px solid #a5c715; border-bottom: 4px solid #a5c715; border-bottom-left-radius: 14px;"></div>
      <div style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; border-right: 4px solid #a5c715; border-bottom: 4px solid #a5c715; border-bottom-right-radius: 14px;"></div>
    </div>
    <span style="position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 14px; color: #b7c1ca;">Hold the ticket’s code in the square</span>
  </div>

  <!-- The answer, in a colour that can be read from across a door. -->
  <div style="margin: 18px 20px 0; padding: 18px; border-radius: 18px; background: #133d2a; border: 1px solid #1f6b47; display: flex; gap: 14px; align-items: center;">
    <div style="width: 52px; height: 52px; flex: 0 0 auto; border-radius: 50%; background: #46c78c; display: flex; align-items: center; justify-content: center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0d1014" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 22px; font-weight: 700; color: #e3f6ec;">Let in</span>
      <span style="font-size: 15px; color: #b9e6cf;">Sam Jones · Tasting · 1 of 2</span>
    </div>
  </div>

  <div style="margin: 10px 20px 0; padding: 12px 16px; border-radius: 14px; background: #1b222a; display: flex; justify-content: space-between; font-size: 14px; color: #94a2ae;">
    <span>Before: Rhian Morgan</span><span style="color: #ff8a8e;">Already in at 7:02</span>
  </div>

  <div style="margin: auto 20px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <a style="height: 52px; border-radius: 14px; background: #1b222a; display: flex; align-items: center; justify-content: center; font-weight: 650; text-decoration: none;">Type a code</a>
    <a style="height: 52px; border-radius: 14px; background: #1b222a; display: flex; align-items: center; justify-content: center; font-weight: 650; text-decoration: none;">Guest list</a>
  </div>
</div>
</x-dc>
</body>
</html>
